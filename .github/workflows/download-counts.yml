name: Record download counts
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: download-count-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test monotonic counter storage
        run: python -m unittest tests.test_download_stats -v
      - name: Preserve cumulative counts on download-metrics branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/update_download_counts.py
