name: Evaluate agent regression traces
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Evaluate synthetic agent traces
        run: python -m opencaliber.ci --suite examples/enterprise/ci-suite.json --config examples/sequence_config.json
      - name: Publish evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencaliber-evaluation
          path: artifacts/ci/
          retention-days: 7
